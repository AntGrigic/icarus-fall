<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <title>Jupiter shades</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Jupiter shades disc golf liga: rezultati i poredak">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efe9df">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161214">
  <script>
    // The light/dark choice from the header (ThemeService), applied before the first paint.
    try {
      var theme = localStorage.getItem('icarus-fall.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.style.colorScheme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Za korištenje aplikacije lige uključi JavaScript.</noscript>
</body>
</html>
